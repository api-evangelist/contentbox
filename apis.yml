aid: contentbox
name: contentbox
description: >-
  ContentBox is a blockchain infrastructure company for the digital content
  industry, built by the team behind Castbox, a global podcast platform serving
  millions of users across 135 countries. ContentBox aims to give the industry
  three things: a shared content pool, a shared user pool, and a unified,
  token-based payout system. Its products include BOX Payout (a blockchain
  multi-party payment system), BOX Passport (blockchain identity and attribution
  across applications), and BOX Unpack (a turn-key platform for content creators).
  The foundation publishes open-source blockchain infrastructure (boxd) and
  first-party developer SDKs in JavaScript, Python, and Java through its
  BOXFoundation GitHub organization. Backed by Qiming Venture Partners.
